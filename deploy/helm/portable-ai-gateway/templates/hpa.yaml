{{- if and .Values.dataPlane.enabled .Values.dataPlane.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "portable-ai-gateway.fullname" . }}-data-plane
  labels:
    {{- include "portable-ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "portable-ai-gateway.fullname" . }}-data-plane
  minReplicas: {{ .Values.dataPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.dataPlane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.dataPlane.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if and .Values.controlPlane.enabled .Values.controlPlane.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "portable-ai-gateway.fullname" . }}-control-plane
  labels:
    {{- include "portable-ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "portable-ai-gateway.fullname" . }}-control-plane
  minReplicas: {{ .Values.controlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.controlPlane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlPlane.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
