# Opt-in configuration override for Vertex AI or a BYO provider reachable
# outside the Compose project. The base mock performs no provider network call;
# host-level policy is required when outbound network denial is mandatory.
services:
  data-plane:
    environment:
      PAG_PROVIDER_HOST_ALLOWLIST: ${PAG_BYO_PROVIDER_HOST:-model-server.example.internal}
      PAG_PROVIDER_CREDENTIAL_BYO: ${PAG_PROVIDER_CREDENTIAL_BYO:-}
    volumes:
      - ./deploy/config/on-prem.yaml:/etc/portable-ai-gateway/config.yaml:ro
    networks:
      - backend
      - host-access
      - provider-egress
  control-plane:
    environment:
      PAG_PROVIDER_HOST_ALLOWLIST: ${PAG_BYO_PROVIDER_HOST:-model-server.example.internal}
    volumes:
      - ./deploy/config/on-prem.yaml:/etc/portable-ai-gateway/config.yaml:ro

networks:
  # Only the data plane joins this provider-specific network. PostgreSQL and
  # Valkey remain exclusively on the internal backend network.
  provider-egress: {}
