api_version: gateway.portable-ai.dev/v1alpha1
kind: GatewayConfiguration
metadata:
  version: development-http-benchmark-v1
spec:
  tenants:
    - id: default
      name: Synthetic benchmark
      sensitive: false
  providers:
    - id: deterministic-http
      tenant_id: default
      kind: openai-compatible
      base_url: http://127.0.0.1:9000/v1
      residency: local
      native_responses: false
  models:
    - id: benchmark-chat
      tenant_id: default
      upstream_model: benchmark-upstream
      capabilities:
        chat: true
        responses: false
        streaming: true
        tools: false
        structured_output: false
        multimodal: false
  routes:
    - id: benchmark-http
      tenant_id: default
      model_id: benchmark-chat
      required_residency: local
      targets:
        - provider_id: deterministic-http
          upstream_model: benchmark-upstream
          residency: local
          priority: 10
          capabilities:
            chat: true
            responses: false
            streaming: true
            tools: false
            structured_output: false
            multimodal: false
  policies:
    - id: benchmark-policy
      tenant_id: default
      max_input_chars: 32768
      denied_parameters: []
  quotas:
    - id: benchmark-quota
      tenant_id: default
      requests_per_minute: 100000
      concurrent_requests: 256
