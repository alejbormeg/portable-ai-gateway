# SPDX-License-Identifier: AGPL-3.0-only
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "portable-ai-gateway"
version = "0.1.0-alpha"
description = "Customer-owned, portable AI gateway for cloud and on-premises deployments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["pg8000>=1.31,<2"]
redis = ["redis>=5,<7"]
vertex = ["google-auth[requests]>=2.38,<3"]
production = [
  "pg8000>=1.31,<2",
  "redis>=5,<7",
  "google-auth[requests]>=2.38,<3",
  "cryptography>=50,<51",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
]

[project.scripts]
portable-ai-gateway = "portable_ai_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portable_ai_gateway"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["portable_ai_gateway"]

[tool.coverage.report]
show_missing = true
skip_covered = true
