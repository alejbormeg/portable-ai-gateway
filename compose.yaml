name: portable-ai-gateway

x-gateway-common: &gateway-common
  image: ${PAG_IMAGE:-portable-ai-gateway:local}
  build:
    context: .
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  environment: &gateway-environment
    PAG_APP_ENV: development
    PAG_DATABASE_URL: postgresql://portable_gateway:${PAG_POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/portable_gateway
    PAG_CACHE_URL: redis://valkey:6379/0
    PAG_CONFIG_PATH: /etc/portable-ai-gateway/config.yaml
    PAG_CONFIG_VERSION: compose-development
    PAG_GITOPS_MODE: "false"
    PAG_ALLOW_ANONYMOUS_DEV: "true"
    PAG_API_KEY_PEPPER: ${PAG_API_KEY_PEPPER:-development-only-change-me}
    PAG_SOURCE_URL: ${PAG_SOURCE_URL:-https://github.com/your-account/portable-ai-gateway}
  volumes:
    - ./deploy/config/development.yaml:/etc/portable-ai-gateway/config.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - backend
    # Docker Engine 29 does not publish host ports for containers attached
    # exclusively to an internal network. This second bridge preserves the
    # loopback quickstart while data services remain backend-only.
    - host-access

services:
  data-plane:
    <<: *gateway-common
    command:
      - data-plane
    ports:
      - "${PAG_BIND_ADDRESS:-127.0.0.1}:${PAG_DATA_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  control-plane:
    <<: *gateway-common
    command:
      - control-plane
    ports:
      - "${PAG_BIND_ADDRESS:-127.0.0.1}:${PAG_CONTROL_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: ${PAG_POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: portable_gateway
      POSTGRES_USER: portable_gateway
      POSTGRES_PASSWORD: ${PAG_POSTGRES_PASSWORD:-development-only-change-me}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portable_gateway -d portable_gateway
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  valkey:
    image: ${PAG_VALKEY_IMAGE:-valkey/valkey:8.0.3-alpine}
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - valkey-data:/data
    networks:
      - backend

networks:
  backend:
    internal: true
  host-access: {}

volumes:
  postgres-data:
  valkey-data:
